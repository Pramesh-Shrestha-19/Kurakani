<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kurakani Auth</title>

    <link rel="stylesheet" href="auth.css">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

    <div class="auth-container">

        <!-- LEFT SIDE -->
        <div class="left-panel">

            <img src="/Kurakani/Images/KuraKani logo.png" class="logo">
    

            <h1>Kurakani</h1>

            <p>
                Guff garna ready?<br>
                Suru garum na ta
            </p>

        </div>


        <!-- RIGHT SIDE -->
        <div class="right-panel">

            <!-- LOGIN -->
            <div class="auth-card" id="loginPanel">

                <h2>Login</h2>

                <form id="loginForm">

                    <div class="input-group">
                        <input type="text" name="username" required>
                        <label>Username</label>
                    </div>

                    <div class="input-group password-group">
                        <input type="password" name="password" required>
                        <label>Password</label>

                        <ion-icon
                        class="toggle-password"
                        name="eye-outline"></ion-icon>
                    </div>

                    <div class="auth-options">

                        <label>
                            <input type="checkbox">
                            Remember Me
                        </label>

                        <a href="#">Forgot Password?</a>

                    </div>

                    <button type="submit">
                        Login
                    </button>

                    <p class="switch-text">
                        Don't have an account?
                        <span id="showSignup">Register</span>
                    </p>

                </form>

            </div>

            <div class="auth-card hidden" id="signupPanel">

            <h2>Sign Up</h2>

            <form id="signupForm">

                <div class="input-group">
                    <input type="text" name="username" required>
                    <label>Username</label>
                </div>

                <div class="input-group">
                    <input type="email" name="email" required>
                    <label>Email</label>
                </div>

                <div class="input-group password-group">
                    <input type="password" name="password" required>
                    <label>Password</label>
                    <ion-icon class="toggle-password" name="eye-outline"></ion-icon>
                </div>

                <div class="input-group password-group">
                    <input type="password" name="confirmPassword" required>
                    <label>Confirm Password</label>
                    <ion-icon class="toggle-password" name="eye-outline"></ion-icon>
                </div>

                <button type="submit">Register</button>

                <p class="switch-text">
                    Already have an account?
                    <span id="showLogin">Login</span>
                </p>

            </form>

        </div>

        </div>

    </div>

</body>
<script src="auth.js"></script>
</html>
